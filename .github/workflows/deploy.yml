name: Deploy to Cloudflare Pages

# MANUAL ONLY. Do not put this back on `push: branches: [main]`.
#
# The live dashboard is built and deployed by the "Command Central Dashboard"
# workflow in queen-lml/gsc-monitoring-agent, which runs every 6 hours: it
# regenerates data.js from live GSC/GA4/WordPress/GHL data and deploys its
# dashboard/ folder to this same Cloudflare Pages project (cc-lyon).
#
# When this repo also deployed on every push to main, the two fought over the
# same project. This repo's data.js is hand-maintained and goes stale, so a push
# here would overwrite the freshly built site with old client data until the next
# 6-hour build put it back. That is why the dashboard kept showing the wrong
# clients. One deployer only.
#
# Running this manually still overwrites live data until the next scheduled
# build. Use it only to preview a UI change, and mirror UI edits (index.html,
# app.js, style.css, assets/) into gsc-monitoring-agent/dashboard/ so the
# scheduled build ships them for real.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   - CLOUDFLARE_API_TOKEN   ("Cloudflare Pages: Edit" template)
#   - CLOUDFLARE_ACCOUNT_ID  (Workers & Pages → account ID)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=cc-lyon --branch=main
